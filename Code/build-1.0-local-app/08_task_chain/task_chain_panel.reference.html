<sc-if value="{{tabs.tasks.open}}" hint-placeholder-val="{{false}}">
<section aria-label="Task chain" style="position: absolute; top: 164px; right: 96px; z-index: 20; width: 400px; max-width: calc(100% - 136px); max-height: calc(100% - 144px); overflow: auto; box-sizing: border-box; background: {{t.flyout}}; border: 1px solid {{t.glassBorder}}; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); box-shadow: {{t.shadow}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path><path d="M13 6h8"></path><path d="M13 12h8"></path><path d="M13 18h8"></path></svg>Task chain</h2>
<div style="display: flex; align-items: center; gap: 6px"><span style="font-size: 12px; color: {{t.muted}}">Engineering → Code → Tech data</span><button type="button" aria-label="Close task chain" onClick="{{tabs.tasks.close}}" style="width: 44px; height: 44px; padding: 0; border-radius: 10px; border: 1px solid {{t.btnBorder}}; background: {{t.btnBg}}; color: {{t.ink}}; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid {{t.line}}; border-radius: 10px; background: {{t.subtle}}"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{t.accent}}"></span><div style="display: flex; flex-direction: column"><span style="font-weight: 500">Engineering</span><span style="font-size: 12px; color: {{t.muted}}">Requirements set · done</span></div></div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid {{t.accent}}; border-radius: 10px; background: {{t.accentSoft}}"><span style="width: 10px; height: 10px; border-radius: 50%; border: 2px solid {{t.accent}}; box-sizing: border-box"></span><div style="display: flex; flex-direction: column"><span style="font-weight: 500">Code</span><span style="font-size: 12px; color: {{t.muted}}">In progress · step 4 of 5</span></div></div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid {{t.line}}; border-radius: 10px; background: {{t.subtle}}"><span style="width: 10px; height: 10px; border-radius: 50%; border: 2px solid {{t.muted}}; box-sizing: border-box"></span><div style="display: flex; flex-direction: column"><span style="font-weight: 500">Tech data</span><span style="font-size: 12px; color: {{t.muted}}">Waiting on review</span></div></div>
</div>
</section>
</sc-if>
