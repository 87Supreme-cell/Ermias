[toolchain]
# Exact Rust version for reproducible builds (native_toolchain_rust requires
# an exact channel). Desktop targets only: macOS, Windows, Linux (D-036).
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
