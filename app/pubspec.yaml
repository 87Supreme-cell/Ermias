name: ermias
description: "Ermias: a local-first research and build workbench."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: 3.13.4
  flutter: 3.47.5

# Every dependency is pinned exactly and recorded in ../DEPENDENCIES.md.
dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/themes.json
