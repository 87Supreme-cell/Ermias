<sc-if value="{{tabs.grade.open}}" hint-placeholder-val="{{false}}">
<section aria-label="Project grade" style="position: absolute; top: 164px; right: 96px; z-index: 20; width: 400px; max-width: calc(100% - 136px); max-height: calc(100% - 144px); overflow: auto; box-sizing: border-box; background: {{t.flyout}}; border: 1px solid {{t.glassBorder}}; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); box-shadow: {{t.shadow}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"></circle><path d="M15.48 12.89 17 22l-5-3-5 3 1.52-9.11"></path></svg>Project grade</h2>
<div style="display: flex; align-items: center; gap: 6px"><span style="font-size: 12px; color: {{t.muted}}">updates each step</span><button type="button" aria-label="Close project grade" onClick="{{tabs.grade.close}}" style="width: 44px; height: 44px; padding: 0; border-radius: 10px; border: 1px solid {{t.btnBorder}}; background: {{t.btnBg}}; color: {{t.ink}}; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
</div>
<div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap">
<span style="font-size: 40px; font-weight: 600; letter-spacing: -0.02em">8.1</span>
<span style="font-size: 14px; color: {{t.muted}}">/ 10</span>
<span style="font-size: 12px; font-weight: 500; color: {{t.accentText}}; background: {{t.accentSoft}}; border-radius: 6px; padding: 2px 8px">+0.3 since last milestone</span>
</div>
<div style="display: flex; flex-direction: column; font-size: 13px">
<div style="display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid {{t.line}}"><span>Source quality (weighted rubric)</span><span style="font-family: 'JetBrains Mono', monospace">8.4</span></div>
<div style="display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid {{t.line}}"><span>Claims with a source</span><span style="font-family: 'JetBrains Mono', monospace">12 / 12</span></div>
<div style="display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid {{t.line}}"><span>Sample agreement</span><span style="font-family: 'JetBrains Mono', monospace">11 / 12</span></div>
<div style="display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid {{t.line}}"><span>Gate calls passed</span><span style="font-family: 'JetBrains Mono', monospace">41 / 42</span></div>
<div style="display: flex; justify-content: space-between; padding: 7px 0"><span>External data share</span><span style="font-family: 'JetBrains Mono', monospace">6%</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; background: {{t.warnSoft}}; border-radius: 10px; padding: 10px">
<span style="font-size: 13px; font-weight: 600; color: {{t.warnText}}">Needs you</span>
<span style="font-size: 12px; color: {{t.warnText}}">1 rejected gate call · 1 claim with split samples</span>
<button type="button" style="font: inherit; font-weight: 500; min-height: 44px; border-radius: 10px; border: 1px solid {{t.warn}}; background: {{t.btnBg}}; color: {{t.warnText}}; cursor: pointer">Review now</button>
</div>
</section>
</sc-if>
