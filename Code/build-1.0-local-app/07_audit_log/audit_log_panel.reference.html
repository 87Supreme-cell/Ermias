<sc-if value="{{tabs.log.open}}" hint-placeholder-val="{{false}}">
<section aria-label="Audit log" style="position: absolute; top: 104px; left: 96px; z-index: 20; width: 400px; max-width: calc(100% - 136px); max-height: calc(100% - 144px); overflow: auto; box-sizing: border-box; background: {{t.flyout}}; border: 1px solid {{t.glassBorder}}; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); box-shadow: {{t.shadow}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M3 6h.01"></path><path d="M3 12h.01"></path><path d="M3 18h.01"></path></svg>Audit log</h2>
<div style="display: flex; align-items: center; gap: 6px"><span style="font-size: 12px; color: {{t.muted}}">saved locally</span><button type="button" aria-label="Close audit log" onClick="{{tabs.log.close}}" style="width: 44px; height: 44px; padding: 0; border-radius: 10px; border: 1px solid {{t.btnBorder}}; background: {{t.btnBg}}; color: {{t.ink}}; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
</div>
<div style="display: flex; flex-direction: column; font-size: 13px">
<a href="#log-1" style="display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid {{t.line}}; color: {{t.ink}}; text-decoration: none"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.muted}}">10:42:18</span><span>Gate passed · search(laws.db)</span></a>
<a href="#log-2" style="display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid {{t.line}}; color: {{t.ink}}; text-decoration: none"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.muted}}">10:42:19</span><span>Retrieved 6 chunks from 3 databases</span></a>
<a href="#log-3" style="display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid {{t.line}}; color: {{t.warnText}}; text-decoration: none"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.muted}}">10:42:31</span><span>Gate rejected · write_file outside allowlist</span></a>
<a href="#log-4" style="display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid {{t.line}}; color: {{t.warnText}}; text-decoration: none"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.muted}}">10:43:02</span><span>Left machine · question only · 412 tokens · frontier API</span></a>
<a href="#log-5" style="display: flex; gap: 10px; padding: 8px 0; color: {{t.ink}}; text-decoration: none"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.muted}}">10:43:05</span><span>External answer stored as data · rank 5</span></a>
</div>
<a href="#log" style="font-size: 13px; font-weight: 500; color: {{t.accentText}}">Open full log</a>
</section>
</sc-if>
