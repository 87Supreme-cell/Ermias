<sc-if value="{{conn.exposedOpen}}" hint-placeholder-val="{{false}}">
<section aria-label="Exposed connection" style="position: absolute; top: 156px; left: 50%; transform: translateX(-50%); z-index: 30; width: 560px; max-width: calc(100% - 40px); box-sizing: border-box; background: {{t.invBg}}; color: {{t.invInk}}; border: 1px solid {{t.invBorder}}; border-radius: 16px; padding: 16px; box-shadow: {{t.shadow}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 6px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 10 10"><path d="M5 0.5 9.6 9.3H0.4z" fill="{{t.riskExposed}}"></path></svg>Exposed connection</h2>
<div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 12px; color: {{t.invMuted}}">active · data leaving the machine</span><button type="button" aria-label="Close exposed connection" onClick="{{conn.close}}" style="width: 44px; height: 44px; padding: 0; border-radius: 10px; border: 1px solid {{t.invBorder}}; background: {{t.invBtn}}; color: {{t.invInk}}; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-top: 1px solid {{t.invLine}}">
<div style="display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap"><span style="font-weight: 600">Frontier API session</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.invMuted}}">[provider endpoint]</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: {{t.invMuted}}"><span>Process: retriever-bridge</span><span>Sent: question only · 412 tokens</span><span>Received: 1 answer → external.db (rank 5)</span><span>Approved by you · 10:43:01</span><span>Encrypted (TLS)</span></div>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" style="font: inherit; font-size: 12px; font-weight: 500; min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid {{t.invBorder}}; background: {{t.invBtn}}; color: {{t.invInk}}; cursor: pointer">End connection</button><button type="button" style="font: inherit; font-size: 12px; font-weight: 500; min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid {{t.invBorder}}; background: {{t.invBtn}}; color: {{t.invInk}}; cursor: pointer">Open in audit log</button></div>
</div></section>
</sc-if>
