<sc-if value="{{tabs.db.open}}" hint-placeholder-val="{{false}}">
<section aria-label="Active databases" style="position: absolute; top: 104px; left: 96px; z-index: 20; width: 400px; max-width: calc(100% - 136px); max-height: calc(100% - 144px); overflow: auto; box-sizing: border-box; background: {{t.flyout}}; border: 1px solid {{t.glassBorder}}; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); box-shadow: {{t.shadow}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5v14a9 3 0 0 0 18 0V5"></path><path d="M3 12a9 3 0 0 0 18 0"></path></svg>Active databases</h2>
<div style="display: flex; align-items: center; gap: 6px"><span style="font-size: 12px; color: {{t.muted}}">rank · weight · grade</span><button type="button" aria-label="Close active databases" onClick="{{tabs.db.close}}" style="width: 44px; height: 44px; padding: 0; border-radius: 10px; border: 1px solid {{t.btnBorder}}; background: {{t.btnBg}}; color: {{t.ink}}; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid {{t.line}}; border-radius: 10px; background: {{t.subtle}}">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.muted}}; width: 16px">1</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; flex: 1">laws.db</span>
<span style="font-size: 12px; font-weight: 500; color: {{t.accentText}}; background: {{t.accentSoft}}; border-radius: 6px; padding: 2px 8px">9/10</span>
<button type="button" aria-pressed="true" style="font: inherit; font-size: 12px; font-weight: 500; min-width: 44px; min-height: 28px; border-radius: 6px; border: 1px solid {{t.accent}}; background: {{t.accent}}; color: {{t.onAccent}}; cursor: pointer">On</button>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding-left: 24px">
<div style="flex: 1; height: 6px; background: {{t.track}}; border-radius: 3px"><div style="width: 100%; height: 6px; background: {{t.accent}}; border-radius: 3px"></div></div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.muted}}">1.0</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid {{t.line}}; border-radius: 10px; background: {{t.subtle}}">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.muted}}; width: 16px">2</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; flex: 1">principles.db</span>
<span style="font-size: 12px; font-weight: 500; color: {{t.accentText}}; background: {{t.accentSoft}}; border-radius: 6px; padding: 2px 8px">8/10</span>
<button type="button" aria-pressed="true" style="font: inherit; font-size: 12px; font-weight: 500; min-width: 44px; min-height: 28px; border-radius: 6px; border: 1px solid {{t.accent}}; background: {{t.accent}}; color: {{t.onAccent}}; cursor: pointer">On</button>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding-left: 24px">
<div style="flex: 1; height: 6px; background: {{t.track}}; border-radius: 3px"><div style="width: 80%; height: 6px; background: {{t.accent}}; border-radius: 3px"></div></div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.muted}}">0.8</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid {{t.line}}; border-radius: 10px; background: {{t.subtle}}">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.muted}}; width: 16px">3</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; flex: 1">practices.db</span>
<span style="font-size: 12px; font-weight: 500; color: {{t.accentText}}; background: {{t.accentSoft}}; border-radius: 6px; padding: 2px 8px">7/10</span>
<button type="button" aria-pressed="true" style="font: inherit; font-size: 12px; font-weight: 500; min-width: 44px; min-height: 28px; border-radius: 6px; border: 1px solid {{t.accent}}; background: {{t.accent}}; color: {{t.onAccent}}; cursor: pointer">On</button>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding-left: 24px">
<div style="flex: 1; height: 6px; background: {{t.track}}; border-radius: 3px"><div style="width: 60%; height: 6px; background: {{t.accent}}; border-radius: 3px"></div></div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.muted}}">0.6</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid {{t.line}}; border-radius: 10px; background: {{t.subtle}}">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.muted}}; width: 16px">4</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; flex: 1">tools.db</span>
<span style="font-size: 12px; font-weight: 500; color: {{t.accentText}}; background: {{t.accentSoft}}; border-radius: 6px; padding: 2px 8px">6/10</span>
<button type="button" aria-pressed="true" style="font: inherit; font-size: 12px; font-weight: 500; min-width: 44px; min-height: 28px; border-radius: 6px; border: 1px solid {{t.accent}}; background: {{t.accent}}; color: {{t.onAccent}}; cursor: pointer">On</button>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding-left: 24px">
<div style="flex: 1; height: 6px; background: {{t.track}}; border-radius: 3px"><div style="width: 40%; height: 6px; background: {{t.accent}}; border-radius: 3px"></div></div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.muted}}">0.4</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px dashed {{t.dashed}}; border-radius: 10px; background: {{t.warnSoft}}">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.muted}}; width: 16px">5</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; flex: 1">external.db</span>
<span style="font-size: 12px; font-weight: 500; color: {{t.warnText}}">data only</span>
<button type="button" aria-pressed="false" style="font: inherit; font-size: 12px; font-weight: 500; min-width: 44px; min-height: 28px; border-radius: 6px; border: 1px solid {{t.btnBorder}}; background: {{t.btnBg}}; color: {{t.ink}}; cursor: pointer">Off</button>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding-left: 24px">
<div style="flex: 1; height: 6px; background: {{t.track}}; border-radius: 3px"><div style="width: 20%; height: 6px; background: {{t.warn}}; border-radius: 3px"></div></div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.muted}}">0.2</span>
</div>
<span style="font-size: 12px; color: {{t.warnText}}; padding-left: 24px">Frontier answers, stored as data, never as instructions</span>
</div>

<button type="button" style="font: inherit; font-weight: 500; min-height: 44px; border-radius: 10px; border: 1px solid {{t.btnBorder}}; background: {{t.btnBg}}; color: {{t.ink}}; cursor: pointer">Adjust ranks and weights</button>
</section>
</sc-if>
